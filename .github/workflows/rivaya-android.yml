name: RIVAYA 2.2 verified build
on:
  push:
    branches: ["rivaya-android"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Recreate source project
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/rivaya.zip
          unzip -q /tmp/rivaya.zip -d "$GITHUB_WORKSPACE"
          mkdir -p app/src/main/assets/www/icons app/src/main/res/drawable
          base64 -d app/src/main/assets/www/icon-512.png.b64 > app/src/main/assets/www/icons/icon-512.png
          cp app/src/main/assets/www/icons/icon-512.png app/src/main/res/drawable/ic_launcher.png
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug and release
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace
      - name: Static APK verification
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          unzip -t app/build/outputs/apk/release/app-release-unsigned.apk >/dev/null
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/www/v28.html'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/www/app-rivaya.js'
      - name: Android 15 emulator — launch, avatar picker, release launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euxo pipefail
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop app.rivaya.smart01
            adb shell monkey -p app.rivaya.smart01 -c android.intent.category.LAUNCHER 1
            sleep 7
            PID=$(adb shell pidof app.rivaya.smart01 | tr -d '\r')
            test -n "$PID"
            adb exec-out screencap -p > rivaya-home.png
            if adb logcat -d -t 1000 | grep -E 'FATAL EXCEPTION: main|Process: app.rivaya.smart01.*has died'; then exit 1; fi
            adb shell am force-stop app.rivaya.smart01
            adb shell am start -n app.rivaya.smart01/.MainActivity --ez rivaya_test_avatar true
            sleep 5
            adb shell dumpsys activity activities > /tmp/activities.txt
            grep -E -i 'documentsui|picker|photo' /tmp/activities.txt
            adb shell am force-stop app.rivaya.smart01 || true
            adb uninstall app.rivaya.smart01 || true
            keytool -genkeypair -noprompt -keystore /tmp/ci.p12 -storetype PKCS12 -storepass ci123456 -keypass ci123456 -alias ci -keyalg RSA -keysize 2048 -validity 3650 -dname 'CN=RIVAYA CI,O=RIVAYA,C=US'
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
            "$APKSIGNER" sign --ks /tmp/ci.p12 --ks-type PKCS12 --ks-pass pass:ci123456 --key-pass pass:ci123456 --out /tmp/rivaya-release-ci.apk app/build/outputs/apk/release/app-release-unsigned.apk
            "$APKSIGNER" verify --verbose /tmp/rivaya-release-ci.apk
            adb install /tmp/rivaya-release-ci.apk
            adb logcat -c
            adb shell monkey -p app.rivaya.smart01 -c android.intent.category.LAUNCHER 1
            sleep 7
            PID=$(adb shell pidof app.rivaya.smart01 | tr -d '\r')
            test -n "$PID"
            if adb logcat -d -t 1000 | grep -E 'FATAL EXCEPTION: main|Process: app.rivaya.smart01.*has died'; then exit 1; fi
      - name: Collect signing tools and unsigned release
        if: always()
        shell: bash
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release-unsigned.apk out/ 2>/dev/null || true
          cp rivaya-home.png out/ 2>/dev/null || true
          APKSIGNER_JAR=$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' | sort -V | tail -1)
          test -n "$APKSIGNER_JAR" && cp "$APKSIGNER_JAR" out/apksigner.jar || true
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          test -n "$ZIPALIGN" && cp "$ZIPALIGN" out/zipalign || true
      - name: Upload verified release bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rivaya-2.2-verified
          path: out/
          if-no-files-found: error